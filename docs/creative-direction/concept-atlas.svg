<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1470" viewBox="0 0 1600 1470" role="img" aria-labelledby="title desc">
<title id="title">XUANYI — three spatial hypotheses</title>
<desc id="desc">Composition diagrams and motion beats for Sky Editorial Sculpture, Living Spatial Canvas, Creative Playground. Planning diagrams only, not final artwork or runnable prototypes.</desc>
<defs>
