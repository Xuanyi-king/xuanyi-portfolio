name: Portfolio CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/check-cross-browser.mjs
        name: WebKit narrow layout smoke
        env:
          BROWSER_LAYOUT_ONLY: "1"
          BROWSER_ENGINES: webkit
          BROWSER_EVIDENCE_DIR: artifacts/browser
      - run: npm run check:browser
        env:
          BROWSER_EVIDENCE_DIR: artifacts/browser
      - run: npm run measure:canvas
      - run: npm run check:strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/browser
          retention-days: 14
