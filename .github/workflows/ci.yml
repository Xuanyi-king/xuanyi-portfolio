name: Portfolio CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: portfolio-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:export
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node scripts/check-cross-browser.mjs
        name: WebKit narrow layout smoke
        env:
          BROWSER_LAYOUT_ONLY: "1"
          BROWSER_ENGINES: webkit
          BROWSER_EVIDENCE_DIR: artifacts/browser
      - run: npm run check:browser
        env:
          BROWSER_EVIDENCE_DIR: artifacts/browser
      - run: npm run check:direction
      - run: |
          node node_modules/serve/build/main.js out -l 4188 > /tmp/direction-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          npm run record:direction
        env:
          BROWSER_BASE_URL: http://localhost:4188
      - run: npm run measure:canvas
      - run: npm run check:strict
      - run: npm run compare:canvas
        env:
          CANVAS_BASELINE_SHA: 75a1e19fe63206c348548b3cfe969355499f7713
        name: Compare verified 2.2 baseline and current canvas with raw traces
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/browser
          retention-days: 14
